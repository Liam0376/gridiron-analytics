[project]
name = "ffanalytics"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn>=0.30.0,<1.0.0",
    "nflreadpy>=0.1.0,<1.0.0",
    "requests>=2.32.0,<3.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "xgboost>=2.0.0,<3.0.0",
    "scikit-learn>=1.4.0,<2.0.0",
    "numpy>=1.26.0,<3.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
