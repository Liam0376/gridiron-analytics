[project]
name = "ffanalytics"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "nflreadpy>=0.1",
    "requests>=2.32",
    "pydantic>=2.9",
    "xgboost>=2.0",
    "scikit-learn>=1.4",
    "numpy>=1.26",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
